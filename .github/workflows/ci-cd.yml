name: Maison Elara CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: maisonelara_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --ignore-scripts

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Run Linting
      run: npm run lint

    - name: Build Next.js
      run: npm run build
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5432/maisonelara_test?schema=public
        NEXTAUTH_SECRET: test_secret_key_for_ci_only_not_production
        NEXTAUTH_URL: http://localhost:3000
        NEXT_PUBLIC_BASE_URL: http://localhost:3000
        STRIPE_SECRET_KEY: sk_test_placeholder
        STRIPE_WEBHOOK_SECRET: whsec_placeholder
        CLOUDINARY_CLOUD_NAME: placeholder
        CLOUDINARY_API_KEY: placeholder
        CLOUDINARY_API_SECRET: placeholder
        RESEND_API_KEY: re_placeholder
        EMAIL_FROM: noreply@maisonelara.com
